<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0d"/>
      <stop offset="55%" stop-color="#16171a"/>
      <stop offset="100%" stop-color="#1c1c1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#FA7343" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#FA7343" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FA7343" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FA7343"/>
      <stop offset="100%" stop-color="#F05138"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- decorative device silhouettes (background layer, left side) -->
  <g opacity="0.16" stroke="#ffffff" stroke-width="2" fill="none">
    <!-- laptop base -->
    <path d="M60 235 L340 235 L322 258 L78 258 Z" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="90" y="120" width="220" height="118" rx="10"/>
    <rect x="104" y="133" width="192" height="92" rx="3" fill="#ffffff" fill-opacity="0.03"/>
    <!-- phone -->
    <rect x="250" y="70" width="92" height="190" rx="22" fill="#0b0b0d"/>
    <rect x="250" y="70" width="92" height="190" rx="22"/>
    <rect x="262" y="90" width="68" height="150" rx="3" fill="#ffffff" fill-opacity="0.03"/>
    <rect x="284" y="80" width="24" height="6" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="none"/>
  </g>

  <!-- code editor mockup card -->
  <g transform="translate(58,70)" opacity="0.98">
    <rect x="0" y="0" width="300" height="150" rx="10" fill="#101114" stroke="#2a2b30" stroke-width="1"/>
    <rect x="0" y="0" width="300" height="24" rx="10" fill="#17181b"/>
    <circle cx="16" cy="12" r="4.2" fill="#ff5f57"/>
    <circle cx="30" cy="12" r="4.2" fill="#febc2e"/>
    <circle cx="44" cy="12" r="4.2" fill="#28c840"/>
    <text x="150" y="16" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b8d93">ProductInteractor.swift</text>
    <text x="16" y="46" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#c586c0">final class</text>
    <text x="98" y="46" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#4ec9b0">ProductInteractor</text>
    <text x="16" y="66" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#569cd6">    func</text>
    <text x="62" y="66" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#dcdcaa">loadProduct</text>
    <text x="140" y="66" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9cdcfe">() async {</text>
    <text x="16" y="86" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#569cd6">        let</text>
    <text x="64" y="86" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9cdcfe">result =</text>
    <text x="130" y="86" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#dcdcaa">await</text>
    <text x="174" y="86" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9cdcfe">worker.fetch()</text>
    <text x="16" y="106" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#569cd6">        presenter</text>
    <text x="92" y="106" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#9cdcfe">.present(result)</text>
    <text x="16" y="126" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#d4d4d4">    }</text>
    <text x="16" y="140" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#d4d4d4">}</text>
  </g>

  <!-- title block -->
  <g transform="translate(380,0)">
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="29" font-weight="700" fill="#f5f5f7">KONSTANTIN IROSHNIKOV</text>
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="url(#accent)">Senior iOS Developer</text>

    <!-- divider -->
    <rect x="0" y="166" width="56" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a1a1a6">Swift · SwiftUI · UIKit · Clean Architecture (VIPER)</text>
    <text x="0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a1a1a6">8+ years · Fintech · Streaming · Marketplace</text>

    <!-- location chip -->
    <g transform="translate(0,248)">
      <rect x="0" y="0" width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#3a3a3d"/>
      <text x="14" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#d1d1d6">Valencia, Spain</text>
    </g>
  </g>
</svg>
